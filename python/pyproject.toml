[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ras-commander-fast-hdf"
version = "0.2.5"
description = "Native (Rust) HEC-RAS HDF engine for ras-commander"
readme = "PYPI_README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"
authors = [{ name = "CLB Engineering Corporation" }]
keywords = ["HEC-RAS", "HDF5", "hydraulics", "ras-commander", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# licenses/: this repository's LICENSE (ras-commander-fast-hdf-LICENSE.txt, a copy of ../LICENSE),
# the ras-commander code the bridge was extracted from, earlier per-crate notices, and
# THIRD-PARTY-NOTICES.md: every crate linked into the wheel with full licence texts.
# Regenerate with scripts/generate_third_party_notices.py (see docs/reference/extension-contract.md, "Licences").
# The wheel's notices live in licenses/ because the sdist root already holds the crate's
# own ../THIRD-PARTY-NOTICES.md (all features).
license-files = ["licenses/*"]

[project.urls]
Homepage = "https://github.com/gpt-cmdr/ras-commander-fast-hdf"
Documentation = "https://rascommander.info/ras/native-engine/"
Source = "https://github.com/gpt-cmdr/ras-commander-fast-hdf"
Issues = "https://github.com/gpt-cmdr/ras-commander-fast-hdf/issues"
Changelog = "https://github.com/gpt-cmdr/ras-commander-fast-hdf/blob/main/CHANGELOG.md"

[project.optional-dependencies]
exports = ["pyarrow>=14", "pyproj>=3.6", "shapely>=2.1"]

[tool.maturin]
# The extension is the `python` feature of the ras-commander-fast-hdf crate at the
# repository root (one crate for the Rust engine and the Python extension).
# Release wheels add exports-all,exports-pmtiles on the command line.
manifest-path = "../Cargo.toml"
module-name = "ras_commander_fast_hdf"
features = ["python", "extension-module"]

[package]
name = "ras-commander-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only native RAS Commander project, plan and HDF engine"

[features]
default = ["catalog"]
catalog = []
hdf = ["dep:hdf5-reader", "dep:ndarray", "dep:rayon", "dep:flate2"]
mesh = ["hdf", "dep:geo"]
results = ["hdf"]

[dependencies]
hdf5-reader = { path = "../../vendor/hdf5-reader", optional = true }
ndarray = { version = "0.17", optional = true }
rayon = { version = "1.10", optional = true }
geo = { version = "0.29", optional = true, default-features = false }
flate2 = { version = "1", optional = true, default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "perf_probe"
required-features = ["hdf"]

[[example]]
name = "perf_metadata_probe"
required-features = ["hdf"]

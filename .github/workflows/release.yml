name: Release

# Push a tag vX.Y.Z on a qualified commit of main (see docs/releasing.md).
# Windows and Linux wheels build on CLB's self-hosted Slurm runners; macOS on GitHub-hosted.
on:
  push:
    tags: ['v*']
  # Build and publish an existing tag again with this workflow (e.g. after a
  # runner outage cancelled the tag's own run). The tag's commit is built;
  # only the workflow comes from the dispatching branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

  WHEEL_FEATURES: extension-module,exports-all,exports-pmtiles,python-arrow

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs_on: '["self-hosted", "Windows", "X64", "clb-ci-windows"]'
          - os: linux
            runs_on: '["self-hosted", "Linux", "X64", "clb-ci-linux"]'
          - os: macos
            # Blacksmith Apple Silicon (macOS 15), like GitHub's arm64 macOS runners.
            runs_on: '["blacksmith-6vcpu-macos-15"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag matches the package version
        shell: bash
        run: |
          version=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "not a release tag: $RELEASE_TAG"; exit 1;; esac
          test "v$version" = "$RELEASE_TAG" || { echo "tag $RELEASE_TAG != v$version"; exit 1; }
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$crate" = "$version" || { echo "Cargo.toml $crate != pyproject.toml $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      # Self-hosted Windows images can preset CARGO_HOME with rustup already
      # installed; the toolchain action then skips adding Cargo's bin to PATH.
      - name: Cargo on PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.13"
      - name: Build wheel
        shell: bash
        run: |
          py="${{ steps.py.outputs.python-path }}"
          "$py" -m pip install --upgrade pip "maturin>=1.9,<2"
          # python/pyproject.toml builds the crate at the repository root.
          cd python
          args=(--release --locked --features "$WHEEL_FEATURES" --out ../dist)
          if [ "$RUNNER_OS" = Linux ]; then
            # manylinux2014 (glibc 2.17 and later); musllinux_1_2 (Alpine) below.
            "$py" -m pip install ziglang
            args+=(--zig --compatibility manylinux2014)
          fi
          "$py" -m maturin build "${args[@]}"
          "$py" -m pip install --force-reinstall ../dist/*.whl
          "$py" -I ../.github/scripts/smoke_wheel.py ../dist "$(git rev-parse HEAD)"
          if [ "$RUNNER_OS" = Linux ]; then
            rustup target add x86_64-unknown-linux-musl
            "$py" -m maturin build --release --locked \
              --features "$WHEEL_FEATURES" --out ../dist \
              --zig --target x86_64-unknown-linux-musl --compatibility musllinux_1_2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ["self-hosted", "Linux", "X64", "clb-ci-linux"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      # maturin sdist runs cargo metadata; the self-hosted Linux image has no Rust.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo on PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.13"
      - name: Source distribution
        shell: bash
        working-directory: python
        run: |
          "${{ steps.py.outputs.python-path }}" -m pip install "maturin>=1.9,<2"
          "${{ steps.py.outputs.python-path }}" -m maturin sdist --out ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    needs: [wheels, sdist]
    runs-on: ["self-hosted", "Linux", "X64", "clb-ci-linux"]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body: See [CHANGELOG.md](https://github.com/gpt-cmdr/ras-commander-fast-hdf/blob/main/CHANGELOG.md).

  pypi:
    # GitHub-hosted: the publish action runs in a Docker container. Opt-in: set the repository variable PUBLISH_PYPI to "true" once PyPI trusts
    # this workflow (trusted publishing) or the pypi environment has PYPI_API_TOKEN.
    if: vars.PUBLISH_PYPI == 'true'
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

name: CI

# Pushes and pull requests run on CLB's self-hosted Slurm runners (clb-ci-linux,
# clb-ci-windows). Pull requests from forks never reach a self-hosted runner: they
# fall back to the GitHub-hosted runner named by matrix.os. macOS is GitHub-hosted
# and runs only on release tags or when requested with include_macos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build and test the macOS wheel"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WHEEL_FEATURES: extension-module,exports-all,exports-pmtiles
  # Everything the wheel compiles except extension-module, which leaves Python
  # symbols for the interpreter to provide and so cannot link a test binary.
  TEST_FEATURES: python,exports-all,exports-pmtiles

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_macos && '["ubuntu-latest", "windows-latest", "macos-14"]' || '["ubuntu-latest", "windows-latest"]') }}
        include:
          - os: ubuntu-latest
            self_hosted: '["self-hosted", "Linux", "X64", "clb-ci-linux"]'
          - os: windows-latest
            self_hosted: '["self-hosted", "Windows", "X64", "clb-ci-windows"]'
    # Fork pull requests -> GitHub-hosted matrix.os; otherwise the self-hosted labels.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('["{0}"]', matrix.os) || matrix.self_hosted || format('["{0}"]', matrix.os)) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted Windows images can preset CARGO_HOME with rustup already
      # installed; the toolchain action then skips adding Cargo's bin to PATH.
      - name: Cargo on PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          # Never restore Cargo's bin folder: the self-hosted Windows image keeps
          # rustup's cargo/rustc proxies there (CARGO_HOME is C:/rust/cargo).
          cache-bin: "false"
          workspaces: |
            . -> target
      - uses: actions/setup-python@v6
        id: py310
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: "3.13"

      # --- Crate ----------------------------------------------------------------
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # The engine features are pure Rust: PyO3, NumPy and the export writers
      # come only with "python" and "exports-*". They also leave out geo (and
      # its pinned i_overlay/i_float), so consumers on other geo versions
      # (terrio, RustGIS) can link the engine.
      - name: Pure-Rust dependency profiles
        shell: bash
        run: |
          for features in "" "catalog" "catalog,hdf,mesh,results"; do
            tree=$(cargo tree --locked --no-default-features --features "$features" --edges normal --prefix none)
            if grep -Eq '^(pyo3|numpy|arrow)' <<< "$tree"; then
              echo "features [$features] pull in a Python or export dependency:"; echo "$tree"; exit 1
            fi
            if grep -Eq '^(geo|i_overlay|i_float) v' <<< "$tree"; then
              echo "features [$features] pull in geo:"; echo "$tree"; exit 1
            fi
          done
      - name: Catalog-only tests (std only)
        run: cargo test --locked --no-default-features --features catalog
      - name: Engine tests (pure Rust)
        run: cargo test --locked --no-default-features --features catalog,hdf,mesh,results
      # Includes the malformed-input regressions, the committed encoding/revision
      # evidence, the engine's reader-policy tests, and the bridge and export tests.
      - name: Tests (all features but extension-module)
        run: cargo test --locked --features "${{ env.TEST_FEATURES }}"
      - name: Clippy
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --all-features --all-targets --no-deps -- -D warnings
          cargo clippy --locked --no-default-features --all-targets --no-deps -- -D warnings
          cargo clippy --locked --no-default-features --features hdf --all-targets --no-deps -- -D warnings
          cargo clippy --locked --no-default-features --features catalog,hdf,mesh,results --all-targets --no-deps -- -D warnings
          cargo clippy --locked --features python --all-targets --no-deps -- -D warnings
      - name: Embedded third-party source matches vendor/PROVENANCE.json
        shell: bash
        run: '"${{ steps.py313.outputs.python-path }}" scripts/vendor_sources.py --check'
      - name: Licence notices are current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          py="${{ steps.py313.outputs.python-path }}"
          "$py" scripts/generate_third_party_notices.py --title "ras-commander-fast-hdf (all features)" --check
          "$py" scripts/generate_third_party_notices.py --features "python,$WHEEL_FEATURES" \
            --title "ras-commander-fast-hdf wheel (release features)" --output python/licenses/THIRD-PARTY-NOTICES.md --check
      # crates.io accepts only registry dependencies and packages under 10 MiB.
      - name: Crate package (crates.io dry run)
        if: runner.os == 'Linux'
        run: cargo publish --locked --dry-run

      # --- Wheel (python/pyproject.toml builds this crate with "python") -------
      - name: Build wheel
        shell: bash
        run: |
          py="${{ steps.py313.outputs.python-path }}"
          "$py" -m pip install --upgrade pip "maturin>=1.9,<2"
          cd python
          args=(--release --locked --features "$WHEEL_FEATURES" --out ../dist)
          if [ "$RUNNER_OS" = Linux ]; then
            # Without Docker, zig links against old libc versions: manylinux2014
            # (glibc 2.17 and later) here, musllinux_1_2 (Alpine) below.
            "$py" -m pip install ziglang
            args+=(--zig --compatibility manylinux2014)
          fi
          "$py" -m maturin build "${args[@]}"
          if [ "$RUNNER_OS" = Linux ]; then
            rustup target add x86_64-unknown-linux-musl
            "$py" -m maturin build --release --locked \
              --features "$WHEEL_FEATURES" --out ../dist-musl \
              --zig --target x86_64-unknown-linux-musl --compatibility musllinux_1_2
          fi
      # The release sdist puts pyproject.toml and the crate in one root.
      - name: Source distribution builds
        if: runner.os == 'Linux'
        shell: bash
        working-directory: python
        run: '"${{ steps.py313.outputs.python-path }}" -m maturin sdist --out ../dist-sdist'
      - name: Smoke test the wheel (Python 3.10 and 3.13)
        shell: bash
        run: |
          for py in "${{ steps.py310.outputs.python-path }}" "${{ steps.py313.outputs.python-path }}"; do
            "$py" -m pip install --force-reinstall dist/*.whl
            # -I keeps the checkout off sys.path so the installed wheel is imported.
            "$py" -I .github/scripts/smoke_wheel.py dist "$(git rev-parse HEAD)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: wheel-Linux-musl
          path: dist-musl/*.whl
          if-no-files-found: error

  linux-compat:
    # Install the Linux wheels where they must run: an old-glibc manylinux2014
    # image and Alpine (musl). GitHub-hosted: containers need Docker.
    name: Linux wheel on ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014 (glibc 2.17)
            image: quay.io/pypa/manylinux2014_x86_64
            artifact: wheel-Linux
            python: /opt/python/cp310-cp310/bin/python
          - name: Alpine (musl)
            image: python:3.12-alpine
            artifact: wheel-Linux-musl
            python: python3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      # Only the smoke test runs in the container: the actions themselves need a
      # newer glibc than manylinux2014's CentOS 7 base.
      - name: Smoke test in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/w -w /w ${{ matrix.image }} sh -c \
            '${{ matrix.python }} -m pip install dist/*.whl && ${{ matrix.python }} -I .github/scripts/smoke_wheel.py dist ${{ github.sha }}'

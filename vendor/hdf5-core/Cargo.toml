# Standalone adaptation of upstream hdf5-core/Cargo.toml (roteiro-gis/netcdf-rust v0.9.3):
# workspace-inherited package, dependency and lint settings written out. See ../LOCAL_PATCHES.md.
[package]
name = "hdf5-core"
description = "Shared HDF5 format types, constants, and validation helpers"
version = "0.9.3"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/netcdf-rust"
homepage = "https://github.com/roteiro-gis/netcdf-rust"
readme = "../README.md"
documentation = "https://docs.rs/hdf5-core"
keywords = ["hdf5", "codec", "scientific-data"]
categories = ["science", "encoding", "parser-implementations"]
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test)"] }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
thiserror = "2"

# Standalone adaptation of upstream hdf5-reader/Cargo.toml (roteiro-gis/netcdf-rust v0.9.3):
# workspace-inherited package, dependency and lint settings written out. See ../LOCAL_PATCHES.md.
[package]
name = "hdf5-reader"
description = "Pure-Rust, read-only HDF5 file decoder with no C dependencies"
version = "0.9.3"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/netcdf-rust"
homepage = "https://github.com/roteiro-gis/netcdf-rust"
readme = "../README.md"
documentation = "https://docs.rs/hdf5-reader"
keywords = ["hdf5", "decoder", "scientific-data", "read-only"]
categories = ["science", "parser-implementations"]
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test)"] }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
hdf5-core = { version = "0.9.3", path = "../hdf5-core" }
ndarray = "0.17"
thiserror = "2"
memmap2 = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
lru = "0.16.3"
parking_lot = "0.12"
smallvec = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[features]
default = ["rayon", "lz4"]
lz4 = ["dep:lz4_flex"]
rayon = ["dep:rayon"]

[dependencies.lz4_flex]
version = "0.11"
optional = true

[dependencies.rayon]
version = "1"
optional = true
